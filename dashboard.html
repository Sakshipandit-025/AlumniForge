<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alumini Forge</title>
  <style>
    body{
      font-family:Poppins,system-ui,sans-serif;
      background:#f9fafb;
      margin:0;
      color:#111
    }
    header{
      background:#010e2b;
      color:#fff;
      padding:2rem;
      text-align:center}
    h1,h2{
      margin:1rem 0
    }
    .container{
      max-width:1200px;
      margin:auto;
      padding:1rem
    }
    .section-title{
      margin-top:2.5rem;
      color:#4f46e5
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem
    }
    .card{
  background:#ffffff;
  padding:1.6rem 1.8rem;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.06);
  cursor:pointer;
  transition:all .25s ease;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 40px rgba(0,0,0,0.1);
}

.card h3{
  font-size:1.3rem;
  font-weight:600;
  margin-bottom:.6rem;
}

.card p{
  font-size:.95rem;
  color:#6b7280;
  line-height:1.4;
}
    .card:hover{transform:translateY(-4px)}
    .hidden{display:none}
    .btn{background:#4f46e5;color:#fff;border:none;padding:.6rem 1rem;border-radius:8px;cursor:pointer}
    ul{list-style:none;padding:0}
    li{margin:.6rem 0}

.resource-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1rem}
.resource-item{background:#f9fafb;padding:1rem 1.2rem;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.06);transition:.2s}
.resource-item:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.1)}
.resource-item a{font-weight:500;display:block}
    a{color:#4f46e5;text-decoration:none;word-break:break-all}
  </style>
</head>
<body>

<header>
  <h1>Alumni Forge</h1>
  <p>All programming resources in one place</p>
</header>

<div class="container">

  <!-- HOME -->
  <div id="home">

    <h2 class="section-title">Programming Languages</h2>
    <div class="grid" id="languages"></div>

    <h2 class="section-title">Frontend</h2>
    <div class="grid" id="frontend"></div>

    <h2 class="section-title">Backend</h2>
    <div class="grid" id="backend"></div>

    <h2 class="section-title">DSA</h2>
    <div class="grid" id="dsa"></div>

  </div>
<script>

const data = {
  languages: ["C","Rust","Java","Kotlin","Python","C++"],
  frontend: ["HTML","CSS","JavaScript"],
  backend: ["MongoDB","Express","React","Node.js"],
  dsa: ["DSA"]   
}

const descriptions = {
  "C":"Foundation of programming & systems",
  "Rust":"Safe systems programming",
  "Java":"Backend & enterprise development",
  "Kotlin":"Modern JVM & Android development",
  "Python":"General-purpose & scripting",
  "HTML":"Structure of the web",
  "CSS":"Styling modern websites",
  "JavaScript":"Interactive web programming",
  "C++":"High-performance programming",
  "MongoDB":"NoSQL database",
  "Express":"Backend framework",
  "React":"Frontend library",
  "Node.js":"JavaScript runtime",
  "DSA":"Data Structures & Algorithms (Interviews + Practice)"
}

function load(section, id){
  const el = document.getElementById(id)

  section.forEach(x=>{
    const card = document.createElement('a')
    card.className = 'card'
    card.style.textDecoration = 'none'

    
    if(x === "DSA"){
      card.href = "dsa.html"
    } else {
      card.href = `${x.toLowerCase().replace('++','pp')}.html`
    }

    card.innerHTML = `
      <h3>${x}</h3>
      <p>${descriptions[x] || 'Learning resources'}</p>
    `

    el.appendChild(card)
  })
}

/* render sections */
load(data.languages,'languages')
load(data.frontend,'frontend')
load(data.backend,'backend')
load(data.dsa,'dsa')
</script>



</body>
</html>

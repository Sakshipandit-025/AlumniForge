<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programming Languages Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI, Tahoma, sans-serif
        }

        body {
            background: #f7f9fc;
            color: #333
        }

        header {
            background: #fff;
            padding: 16px 50px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .06);
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        header h2 {
            font-weight: 600;
            color: #2c3e50
        }

        nav a {
            margin-left: 24px;
            text-decoration: none;
            color: #555;
            font-size: 15px
        }

        .container {
            padding: 40px 60px
        }

        .languages {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px
        }

        .lang-card {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .05);
            transition: .3s
        }

        .lang-card:hover {
            transform: translateY(-4px)
        }

        .details {
            display: none
        }

        .section {
            background: #fff;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .05)
        }

        .section h3 {
            margin-bottom: 15px;
            color: #2c3e50
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px
        }

        .video-card iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            border-radius: 6px
        }

        .video-card p {
            font-size: 14px;
            margin-top: 6px;
            color: #444
        }
    </style>
</head>

<body>

    <header>
        <h2>Data Structures and Algorithms</h2>
        <nav>
            <a href="#">Home</a>
        </nav>
    </header>

    <div class="container">

        <div class="languages">

            <div class="lang-card" onclick="openLang('DSA')">
                <h3>Data Structures and Algorithms</h3>
            </div>

        </div>

        
        

        

        <div id="DSA" class="details">
            <div class="section">
                <h3>Documentation</h3>
                <a href="http://w3schools.com/dsa/" target="_blank">DSA-Documentation</a><br>
            </div>

            <div class="section">
                <h3>Certification</h3>
                <a href="https://www.coursera.org/courses?query=data%20structures%20and%20algorithms"
                    target="_blank">Certification</a>
            </div>

            <div class="section">
                <h3>Resources</h3>
                <div class="video-grid">
                    <div class="video-card"><iframe
                            src="https://www.youtube.com/embed/WQoB2z67hvY?si=16DegdtZju2G0rS3"></iframe></div>
                    <div class="video-card"><iframe
                            src="https://www.youtube.com/embed/0bHoB32fuj0?si=y0ItKK_oLGrGHJSo"></iframe></div>
                </div>
            </div>

            <div class="section">
                <h3>Roadmap</h3><a href="https://roadmap.sh/datastructures-and-algorithms" target="_blank">View
                    Roadmap</a>
            </div>
        </div>

        <script>

            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('.details').forEach(d => d.classList.remove('active'));
            });

            function openLang(id) {

                const all = document.querySelectorAll('.details');
                all.forEach(sec => sec.style.display = 'none');


                const target = document.getElementById(id);
                if (!target) return;

                target.style.display = 'block';
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        </script>

</body>

</html>
